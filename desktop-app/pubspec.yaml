name: biasharamax_desktop
description: BiasharaMax Desktop Edition — offline-first Flutter desktop client for BiasharaMax, installed locally on a business's own PC/POS terminal.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Local database (offline cache + outbox)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure local storage for the Sanctum token, license key, device id
  flutter_secure_storage: ^9.2.2

  # IDs for idempotency keys / stable device fingerprint fallback
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.19.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
