<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BiasharaMax — Offline</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f9fafb;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #ede9fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon svg { width: 32px; height: 32px; color: #4f46e5; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
        p { color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: .5rem;
            padding: .75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        button:hover { background: #4338ca; }
        .sw-note { margin-top: 1rem; font-size: .8rem; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M12 12h.01M6.343 6.343a9 9 0 000 12.728M9.172 9.172a5 5 0 000 7.072" />
            </svg>
        </div>
        <h1>You are offline</h1>
        <p>BiasharaMax needs an internet connection to show live business data. Please check your network and try again.</p>
        <button onclick="window.location.reload()">Try again</button>
        <p class="sw-note">BiasharaMax &mdash; Business Management System</p>
    </div>
</body>
</html>
